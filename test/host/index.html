<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>diorama test host</title>
    <style>
      body { margin: 0; font: 13px system-ui, sans-serif; background: #e9e9e9; color: #222; }
      body.dark { background: #111; color: #ddd; }
      main { max-width: var(--w, 760px); margin: 12px auto; }
      .bubble { background: #fff; border-radius: 8px; overflow: hidden; }
      .dark .bubble { background: #1f1f1f; }
      iframe { display: block; width: 100%; border: 0; height: 200px; }
      #chat { margin: 10px 0; padding: 0; list-style: none; display: grid; gap: 6px; }
      #chat li { background: #dbe7ff; color: #111; border-radius: 8px; padding: 6px 10px; white-space: pre-wrap; }
      #status { font-size: 11px; opacity: 0.7; margin: 4px 2px; }
    </style>
  </head>
  <body>
    <main>
      <div id="status">loading…</div>
      <div class="bubble"><iframe id="view" title="view" sandbox="allow-scripts allow-same-origin"></iframe></div>
      <ul id="chat"></ul>
    </main>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
