00" text-anchor="middle">✓</text><text x="48" y="387" font-size="11" fill="#1f2328" font-weight="600">R4  Invite emails land in spam</text><text x="48" y="401" font-size="10" fill="#6b7280">Mitigation: send from the verified domain, add DKIM for the new sender</text><text x="732" y="387" font-size="10" fill="#6b7280" text-anchor="end">1 day</text></g><g opacity="0.42"><rect x="20" y="412" width="720" height="36" rx="4" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><rect x="29" y="424" width="12" height="12" rx="2" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="48" y="427" font-size="11" fill="#1f2328" font-weight="600">R5  Billing page shows per-user totals for a week</text><text x="48" y="441" font-size="10" fill="#6b7280">Mitigation: banner explaining the transition</text><text x="732" y="427" font-size="10" fill="#6b7280" text-anchor="end">0.5 day</text></g><line x1="0" y1="470" x2="760" y2="470" stroke="#c5cad3" stroke-width="1"/><rect x="20" y="484" width="545.4" height="30" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="30" y="503" font-size="11" fill="#6b7280">Add a note (optional)</text><rect x="575.4" y="484" width="164.6" height="30" rx="5" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="657.7" y="503" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">Confirm selection (3)</text>
