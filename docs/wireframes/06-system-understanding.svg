<path d="M0,8 a8,8 0 0 1 8,-8 h744 a8,8 0 0 1 8,8 v22 h-760 z" fill="#f4f5f7"/><line x1="0" y1="30" x2="760" y2="30" stroke="#c5cad3" stroke-width="1"/><circle cx="20" cy="15" r="4" fill="#2f6fde"/><text x="30" y="19" font-size="11" fill="#1f2328" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">present_decision</text><text x="740" y="19" font-size="10" fill="#6b7280" text-anchor="end">waits for your answer</text><text x="20" y="54" font-size="15" fill="#1f2328" font-weight="600">How checkout works today</text><text x="20" y="70" font-size="11" fill="#6b7280">My reading of services/checkout, services/payments and the queue consumers. I will base the change on this.</text><rect x="20" y="84" width="3" height="20" rx="1" fill="#2f6fde" stroke="none" stroke-width="1"/><text x="31" y="98" font-size="12" fill="#1f2328" font-weight="600">Is this how it works? Reject anything I got wrong.</text><g transform="translate(20,118) scale(0.991)"><g opacity="0.42"><polyline points="80.1,68 132.3,68 184.5,68" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="184.5,68 179,65.7 179,70.3" fill="#6b7280"/><rect x="91.1" y="60" width="82.4" height="15" rx="2" fill="#ffffff" stroke="none" stroke-width="1"/><text x="132.3" y="71.5" font-size="9.5" fill="#6b7280" text-anchor="middle">POST /checkout</text></g><g opacity="0.42"><polyline points="265.4,82 329.9,112 383.2,112" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="383.2,112 377.6,109.7 377.6,114.3" fill="#6b7280"/><rect x="302.7" y="104" width="54.4" height="15" rx="2" fill="#ffffff" stroke="none" stroke-width="1"/><text x="329.9" y="115.5" font-size="9.5" fill="#6b7280" text-anchor="middle">1 reserve</text></g><g opacity="0.42"><polyline points="286.1,68 329.9,68 386.3,68" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="386.3,68 380.8,65.7 380.8,70.3" fill="#6b7280"/><rect x="297.1" y="60" width="65.6" height="15" rx="2" fill="#ffffff" stroke="none" stroke-width="1"/><text x="329.9" y="71.5" font-size="9.5" fill="#6b7280" text-anchor="middle">2 authorise</text></g><g opacity="0.42"><polyline points="462.7,68 486.3,68 532,68" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="532,68 526.4,65.7 526.4,70.3" fill="#6b7280"/></g><g opacity="0.42"><polyline points="265.4,54 329.9,24 373.7,24" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="373.7,24 368.2,21.7 368.2,26.3" fill="#6b7280"/><rect x="302.7" y="16" width="54.4" height="15" rx="2" fill="#ffffff" stroke="none" stroke-width="1"/><text x="329.9" y="27.5" font-size="9.5" fill="#6b7280" text-anchor="middle">3 publish</text></g><g opacity="0.42"><polyline points="475.3,24 486.3,24 497.3,24" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="497.3,24 491.8,21.7 491.8,26.3" fill="#6b7280"/></g><g opacity="0.42"><polyline points="630.4,24 641.4,24 652.4,24" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="652.4,24 646.9,21.7 646.9,26.3" fill="#6b7280"/></g><g opacity="0.42"><rect x="10" y="54" width="70.1" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="45.1" y="72" font-size="11" fill="#1f2328" text-anchor="middle">Web app</text></g><g opacity="0.42"><rect x="184.5" y="54" width="101.6" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="235.3" y="72" font-size="11" fill="#1f2328" text-anchor="middle">Checkout API</text></g><g opacity="1"><rect x="383.2" y="98" width="82.7" height="28" rx="5" fill="#e3edfd" stroke="#2f6fde" stroke-width="1.6"/><text x="424.5" y="116" font-size="11" fill="#1f2328" text-anchor="middle">Inventory</text></g><g opacity="0.42"><rect x="386.3" y="54" width="76.4" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="424.5" y="72" font-size="11" fill="#1f2328" text-anchor="middle">Payments</text></g><g opacity="0.42"><rect x="532" y="54" width="63.8" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="563.9" y="72" font-size="11" fill="#1f2328" text-anchor="middle">Stripe</text></g><g opacity="0.42"><rect x="373.7" y="10" width="101.6" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="424.5" y="28" font-size="11" fill="#1f2328" text-anchor="middle">orders queue</text></g><g opacity="0.42"><rect x="497.3" y="10" width="133.1" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="563.9" y="28" font-size="11" fill="#1f2328" text-anchor="middle">Fulfilment worker</text></g><g opacity="0.42"><rect x="652.4" y="10" width="63.8" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="684.3" y="28" font-size="11" fill="#1f2328" text-anchor="middle">Mailer</text></g></g><text x="20" y="280.8" font-size="10.5" fill="#6b7280" font-weight="600">What I am assuming</text><g opacity="0.42"><rect x="20" y="288.8" width="720" height="36" rx="4" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><rect x="28" y="299.8" width="15" height="14" rx="3" fill="#2e9e5b" stroke="#2e9e5b" stroke-width="1"/><text x="35.5" y="310.8" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">✓</text><rect x="46" y="299.8" width="15" height="14" rx="3" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="53.5" y="310.8" font-size="10" fill="#6b7280" font-weight="600" text-anchor="middle">✗</text><text x="68" y="303.8" font-size="11" fill="#1f2328" font-weight="600">Payment authorisation is synchronous</text><text x="68" y="317.8" font-size="10" fill="#6b7280">checkout waits for Stripe before answering the browser</text></g><g opacity="0.42"><rect x="20" y="328.8" width="720" height="22" rx="4" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><rect x="28" y="332.8" width="15" height="14" rx="3" fill="#2e9e5b" stroke="#2e9e5b" stroke-width="1"/><text x="35.5" y="343.8" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">✓</text><rect x="46" y="332.8" width="15" height="14" rx="3" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="53.5" y="343.8" font-size="10" fill="#6b7280" font-weight="600" text-anchor="middle">✗</text><text x="68" y="343.8" font-size="11" fill="#1f2328" font-weight="600">Capture happens later, in the fulfilment worker</text></g><g opacity="1"><rect x="20" y="354.8" width="720" height="36" rx="4" fill="#e3edfd" stroke="#2f6fde" stroke-width="1.6"/><rect x="28" y="365.8" width="15" height="14" rx="3" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="35.5" y="376.8" font-size="10" fill="#6b7280" font-weight="600" text-anchor="middle">✓</text><rect x="46" y="365.8" width="15" height="14" rx="3" fill="#d14b4b" stroke="#d14b4b" stroke-width="1"/><text x="53.5" y="376.8" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">✗</text><text x="68" y="369.8" font-size="11" fill="#1f2328" font-weight="600">Inventory is reserved before payment</text><text x="68" y="383.8" font-size="10" fill="#6b7280">a failed payment releases the reservation</text></g><g opacity="0.42"><rect x="20" y="394.8" width="720" height="22" rx="4" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><rect x="28" y="398.8" width="15" height="14" rx="3" fill="#2e9e5b" stroke="#2e9e5b" stroke-width="1"/><text x="35.5" y="409.8" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">✓</text><rect x="46" y="398.8" width="15" height="14" rx="3" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="53.5" y="409.8" font-size="10" fill="#6b7280" font-weight="600" text-anchor="middle">✗</text><text x="68" y="409.8" font-size="11" fill="#1f2328" font-weight="600">The confirmation email is sent by the worker, not the API</text></g><rect x="20" y="438.8" width="720" height="37" rx="6" fill="#e3edfd" stroke="#2f6fde" stroke-width="1"/><text x="32" y="458.8" font-size="10.5" fill="#2f6fde" font-weight="600">Step 3 of 4</text><text x="116" y="458.8" font-size="11" fill="#1f2328">Inventory is reserved before payment: a failed payment releases the reservation.</text><rect x="682" y="446.3" width="22" height="22" rx="11" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="693" y="461.3" font-size="13" fill="#1f2328" text-anchor="middle">‹</text><rect x="710" y="446.3" width="22" height="22" rx="11" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="721" y="461.3" font-size="13" fill="#fff" text-anchor="middle">›</text><line x1="0" y1="491.8" x2="760" y2="491.8" stroke="#c5cad3" stroke-width="1"/><rect x="20" y="505.8" width="493.8" height="30" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="30" y="524.8" font-size="11" fill="#1f2328">inventory is reserved AFTER payment authorisation, not before</text><rect x="523.8" y="505.8" width="94.4" height="30" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="571" y="524.8" font-size="11" fill="#1f2328" text-anchor="middle">Approve all</text><rect x="628.2" y="505.8" width="111.8" height="30" rx="5" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="684.1" y="524.8" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">Submit review</text><text x="20" y="551.8" font-size="10.5" fill="#6b7280">3 approved · 1 rejected</text>
