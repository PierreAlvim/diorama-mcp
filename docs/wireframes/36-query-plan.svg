<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 354" width="760" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="759" height="353" rx="8" fill="#ffffff" stroke="#c5cad3"/>
<path d="M0,8 a8,8 0 0 1 8,-8 h744 a8,8 0 0 1 8,8 v22 h-760 z" fill="#f4f5f7"/><line x1="0" y1="30" x2="760" y2="30" stroke="#c5cad3" stroke-width="1"/><circle cx="20" cy="15" r="4" fill="#2e9e5b"/><text x="30" y="19" font-size="11" fill="#1f2328" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">present_view</text><text x="740" y="19" font-size="10" fill="#6b7280" text-anchor="end">does not block the agent</text><text x="20" y="54" font-size="15" fill="#1f2328" font-weight="600">Why the orders report takes 4.1 s</text><text x="20" y="70" font-size="11" fill="#6b7280">EXPLAIN ANALYZE of the report query on a production snapshot. Bars show time spent in each node, children included.</text><g opacity="0.42"><text x="22" y="102" font-size="11" fill="#1f2328" font-weight="600">Sort</text><text x="57.2" y="102" font-size="10" fill="#6b7280">by created_at desc</text><rect x="460" y="93" width="90" height="10" rx="2" fill="#6b7280" fill-opacity="0.55" stroke="none" stroke-width="1"/><text x="554" y="102" font-size="9.5" fill="#6b7280">4120 ms</text><text x="740" y="102" font-size="10" fill="#6b7280" text-anchor="end">50 rows</text></g><line x1="26" y1="103.5" x2="26" y2="121" stroke="#c5cad3" stroke-width="1"/><line x1="26" y1="121" x2="37" y2="121" stroke="#c5cad3" stroke-width="1"/><g opacity="0.42"><text x="42" y="125" font-size="11" fill="#1f2328" font-weight="600">HashAggregate</text><text x="133.9" y="125" font-size="10" fill="#6b7280">group by customer_id</text><rect x="460" y="116" width="89.3" height="10" rx="2" fill="#6b7280" fill-opacity="0.55" stroke="none" stroke-width="1"/><text x="553.3" y="125" font-size="9.5" fill="#6b7280">4090 ms</text><text x="740" y="125" font-size="10" fill="#6b7280" text-anchor="end">8,412 rows</text></g><line x1="46" y1="126.5" x2="46" y2="144" stroke="#c5cad3" stroke-width="1"/><line x1="46" y1="144" x2="57" y2="144" stroke="#c5cad3" stroke-width="1"/><g opacity="0.42"><text x="62" y="148" font-size="11" fill="#1f2328" font-weight="600">Hash Join</text><text x="128.7" y="148" font-size="10" fill="#6b7280">orders.customer_id = customers.id</text><rect x="460" y="139" width="86.3" height="10" rx="2" fill="#6b7280" fill-opacity="0.55" stroke="none" stroke-width="1"/><text x="550.3" y="148" font-size="9.5" fill="#6b7280">3950 ms</text><text x="740" y="148" font-size="10" fill="#6b7280" text-anchor="end">1.9M rows</text></g><line x1="66" y1="149.5" x2="66" y2="167" stroke="#c5cad3" stroke-width="1"/><line x1="66" y1="167" x2="77" y2="167" stroke="#c5cad3" stroke-width="1"/><g opacity="1"><rect x="78" y="157" width="662" height="20" rx="4" fill="#e3edfd" stroke="none" stroke-width="1"/><circle cx="88" cy="167" r="5" fill="#d14b4b"/><text x="102" y="171" font-size="11" fill="#1f2328">Seq Scan on orders</text><text x="225.4" y="171" font-size="10" fill="#6b7280">filter: status = 'paid' and created_at …</text><rect x="460" y="162" width="78.9" height="10" rx="2" fill="#d14b4b" fill-opacity="0.55" stroke="none" stroke-width="1"/><text x="542.9" y="171" font-size="9.5" fill="#6b7280">3610 ms</text><text x="740" y="171" font-size="10" fill="#6b7280" text-anchor="end">1.9M of 14M rows</text></g><line x1="66" y1="172.5" x2="66" y2="190" stroke="#c5cad3" stroke-width="1"/><line x1="66" y1="190" x2="77" y2="190" stroke="#c5cad3" stroke-width="1"/><g opacity="0.42"><text x="82" y="194" font-size="11" fill="#1f2328" font-weight="600">Hash</text><rect x="460" y="185" width="1.9" height="10" rx="2" fill="#6b7280" fill-opacity="0.55" stroke="none" stroke-width="1"/><text x="465.9" y="194" font-size="9.5" fill="#6b7280">85 ms</text><text x="740" y="194" font-size="10" fill="#6b7280" text-anchor="end">41k rows</text></g><line x1="86" y1="195.5" x2="86" y2="213" stroke="#c5cad3" stroke-width="1"/><line x1="86" y1="213" x2="97" y2="213" stroke="#c5cad3" stroke-width="1"/><g opacity="0.42"><circle cx="108" cy="213" r="5" fill="#2e9e5b"/><text x="122" y="217" font-size="11" fill="#1f2328">Index Scan on customers</text><text x="276.9" y="217" font-size="10" fill="#6b7280">customers_pkey</text><rect x="460" y="208" width="1.4" height="10" rx="2" fill="#2e9e5b" fill-opacity="0.55" stroke="none" stroke-width="1"/><text x="465.4" y="217" font-size="9.5" fill="#6b7280">62 ms</text><text x="740" y="217" font-size="10" fill="#6b7280" text-anchor="end">41k rows</text></g><rect x="20" y="244" width="720" height="52" rx="6" fill="#e3edfd" stroke="#2f6fde" stroke-width="1"/><text x="32" y="264" font-size="10.5" fill="#2f6fde" font-weight="600">Step 1 of 2</text><text x="116" y="264" font-size="11" fill="#1f2328">88% of the time is one sequential scan: Postgres reads all 14M orders to keep 1.9M. There is</text><text x="116" y="279" font-size="11" fill="#1f2328">no index on (status, created_at).</text><rect x="682" y="259" width="22" height="22" rx="11" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="693" y="274" font-size="13" fill="#1f2328" text-anchor="middle">‹</text><rect x="710" y="259" width="22" height="22" rx="11" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="721" y="274" font-size="13" fill="#fff" text-anchor="middle">›</text><line x1="0" y1="312" x2="760" y2="312" stroke="#c5cad3" stroke-width="1"/><text x="20" y="336" font-size="10.5" fill="#6b7280">Click any element to ask the agent about it.</text>
</svg>
