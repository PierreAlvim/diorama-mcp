<path d="M0,8 a8,8 0 0 1 8,-8 h744 a8,8 0 0 1 8,8 v22 h-760 z" fill="#f4f5f7"/><line x1="0" y1="30" x2="760" y2="30" stroke="#c5cad3" stroke-width="1"/><circle cx="20" cy="15" r="4" fill="#2f6fde"/><text x="30" y="19" font-size="11" fill="#1f2328" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">present_decision</text><text x="740" y="19" font-size="10" fill="#6b7280" text-anchor="end">waits for your answer</text><text x="20" y="54" font-size="15" fill="#1f2328" font-weight="600">Rebase of feat/invoices onto main</text><text x="20" y="70" font-size="11" fill="#6b7280">3 conflicts in 2 files. "Ours" is feat/invoices, "theirs" is main.</text><rect x="20" y="84" width="3" height="20" rx="1" fill="#2f6fde" stroke="none" stroke-width="1"/><text x="31" y="98" font-size="12" fill="#1f2328" font-weight="600">How should each conflict be resolved?</text><text x="20" y="128" font-size="10.5" fill="#6b7280" font-weight="600">1 · src/billing/tax.ts — computeTax()</text><g opacity="1"><rect x="20" y="136" width="233.3" height="90" rx="6" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="30" y="155" font-size="12" fill="#1f2328" font-weight="600">Ours</text><circle cx="236.33333333333334" cy="151" r="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="30" y="168" font-size="10.5" fill="#6b7280">Adds a `region` parameter so</text><text x="30" y="181" font-size="10.5" fill="#6b7280">invoices can use per-region rates.</text></g><g opacity="1"><rect x="263.3" y="136" width="233.3" height="90" rx="6" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="273.3" y="155" font-size="12" fill="#1f2328" font-weight="600">Theirs</text><circle cx="479.66666666666674" cy="151" r="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="273.3" y="168" font-size="10.5" fill="#6b7280">Fixes rounding: rounds per line</text><text x="273.3" y="181" font-size="10.5" fill="#6b7280">instead of on the total (fix c9d0).</text></g><g opacity="1"><rect x="506.7" y="136" width="233.3" height="90" rx="6" fill="#ffffff" stroke="#2f6fde" stroke-width="2"/><text x="516.7" y="155" font-size="12" fill="#1f2328" font-weight="600">Both</text><circle cx="723" cy="151" r="6" fill="#ffffff" stroke="#2f6fde" stroke-width="1.4"/><circle cx="723" cy="151" r="3" fill="#2f6fde"/><text x="516.7" y="168" font-size="9.5" fill="#2f6fde" font-weight="600">★ recommended</text><text x="516.7" y="181" font-size="10.5" fill="#6b7280">Keep the new parameter and apply</text><text x="516.7" y="194" font-size="10.5" fill="#6b7280">per-line rounding. The changes touch</text><text x="516.7" y="207" font-size="10.5" fill="#6b7280">different statements.</text></g><text x="20" y="254" font-size="10.5" fill="#6b7280" font-weight="600">2 · src/billing/tax.ts — imports</text><g opacity="1"><rect x="20" y="262" width="233.3" height="90" rx="6" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="30" y="281" font-size="12" fill="#1f2328" font-weight="600">Ours</text><circle cx="236.33333333333334" cy="277" r="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="30" y="294" font-size="10.5" fill="#6b7280">Imports `Decimal` from decimal.js.</text></g><g opacity="1"><rect x="263.3" y="262" width="233.3" height="90" rx="6" fill="#ffffff" stroke="#2f6fde" stroke-width="2"/><text x="273.3" y="281" font-size="12" fill="#1f2328" font-weight="600">Theirs</text><circle cx="479.66666666666674" cy="277" r="6" fill="#ffffff" stroke="#2f6fde" stroke-width="1.4"/><circle cx="479.66666666666674" cy="277" r="3" fill="#2f6fde"/><text x="273.3" y="294" font-size="9.5" fill="#2f6fde" font-weight="600">★ recommended</text><text x="273.3" y="307" font-size="10.5" fill="#6b7280">Imports `Decimal` from the internal</text><text x="273.3" y="320" font-size="10.5" fill="#6b7280">money package, which wraps</text><text x="273.3" y="333" font-size="10.5" fill="#6b7280">decimal.js.</text></g><g opacity="1"><rect x="506.7" y="262" width="233.3" height="90" rx="6" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="516.7" y="281" font-size="12" fill="#1f2328" font-weight="600">Both</text><circle cx="723" cy="277" r="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="516.7" y="294" font-size="10.5" fill="#6b7280">Not applicable: the two imports</text><text x="516.7" y="307" font-size="10.5" fill="#6b7280">declare the same name.</text></g><text x="20" y="380" font-size="10.5" fill="#6b7280" font-weight="600">3 · package.json — pdfkit version</text><g opacity="1"><rect x="20" y="388" width="233.3" height="77" rx="6" fill="#ffffff" stroke="#2f6fde" stroke-width="2"/><text x="30" y="407" font-size="12" fill="#1f2328" font-weight="600">Ours</text><circle cx="236.33333333333334" cy="403" r="6" fill="#ffffff" stroke="#2f6fde" stroke-width="1.4"/><circle cx="236.33333333333334" cy="403" r="3" fill="#2f6fde"/><text x="30" y="420" font-size="9.5" fill="#2f6fde" font-weight="600">★ recommended</text><text x="30" y="433" font-size="10.5" fill="#6b7280">pdfkit ^0.15 — needed for the</text><text x="30" y="446" font-size="10.5" fill="#6b7280">invoice PDF tables.</text></g><g opacity="1"><rect x="263.3" y="388" width="233.3" height="77" rx="6" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="273.3" y="407" font-size="12" fill="#1f2328" font-weight="600">Theirs</text><circle cx="479.66666666666674" cy="403" r="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="273.3" y="420" font-size="10.5" fill="#6b7280">pdfkit ^0.13 — bumped by the</text><text x="273.3" y="433" font-size="10.5" fill="#6b7280">dependency bot.</text></g><g opacity="1"><rect x="506.7" y="388" width="233.3" height="77" rx="6" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="516.7" y="407" font-size="12" fill="#1f2328" font-weight="600">Both</text><circle cx="723" cy="403" r="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="516.7" y="420" font-size="10.5" fill="#6b7280">Not applicable: one version must</text><text x="516.7" y="433" font-size="10.5" fill="#6b7280">win.</text></g><line x1="0" y1="483" x2="760" y2="483" stroke="#c5cad3" stroke-width="1"/><rect x="20" y="497" width="512.4" height="30" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="30" y="516" font-size="11" fill="#6b7280">Add a note (optional)</text><rect x="542.4" y="497" width="197.6" height="30" rx="5" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="641.2" y="516" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">Confirm 3 of 3 resolutions</text>
</svg>
