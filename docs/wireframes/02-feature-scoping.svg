<path d="M0,8 a8,8 0 0 1 8,-8 h744 a8,8 0 0 1 8,8 v22 h-760 z" fill="#f4f5f7"/><line x1="0" y1="30" x2="760" y2="30" stroke="#c5cad3" stroke-width="1"/><circle cx="20" cy="15" r="4" fill="#2f6fde"/><text x="30" y="19" font-size="11" fill="#1f2328" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">present_decision</text><text x="740" y="19" font-size="10" fill="#6b7280" text-anchor="end">waits for your answer</text><text x="20" y="54" font-size="15" fill="#1f2328" font-weight="600">Report export scope</text><text x="20" y="70" font-size="11" fill="#6b7280">Ticket PROJ-812 asks for "export reports". Reports can reach 400k rows; the API has a 30s request timeout.</text><rect x="20" y="84" width="3" height="20" rx="1" fill="#2f6fde" stroke="none" stroke-width="1"/><text x="31" y="98" font-size="12" fill="#1f2328" font-weight="600">Which scope should I build?</text><g opacity="1"><rect x="20" y="118" width="233.3" height="140" rx="6" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="30" y="137" font-size="12" fill="#1f2328" font-weight="600">Minimal</text><circle cx="236.33333333333334" cy="133" r="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="30" y="150" font-size="10.5" fill="#6b7280">Synchronous CSV of the current view,</text><text x="30" y="163" font-size="10.5" fill="#6b7280">capped at 10k rows.</text><text x="30" y="182" font-size="10.5" fill="#2e9e5b">+ Ships this week</text><text x="30" y="195" font-size="10.5" fill="#d14b4b">− Fails for large reports</text><text x="30" y="249" font-size="9.5" fill="#6b7280">effort: low</text></g><g opacity="1"><rect x="263.3" y="118" width="233.3" height="140" rx="6" fill="#e3edfd" stroke="#2f6fde" stroke-width="2"/><text x="273.3" y="137" font-size="12" fill="#1f2328" font-weight="600">Standard</text><circle cx="479.66666666666674" cy="133" r="6" fill="#ffffff" stroke="#2f6fde" stroke-width="1.4"/><circle cx="479.66666666666674" cy="133" r="3" fill="#2f6fde"/><text x="273.3" y="