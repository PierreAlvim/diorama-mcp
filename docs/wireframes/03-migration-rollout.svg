<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 531" width="760" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="759" height="530" rx="8" fill="#ffffff" stroke="#c5cad3"/>
<path d="M0,8 a8,8 0 0 1 8,-8 h744 a8,8 0 0 1 8,8 v22 h-760 z" fill="#f4f5f7"/><line x1="0" y1="30" x2="760" y2="30" stroke="#c5cad3" stroke-width="1"/><circle cx="20" cy="15" r="4" fill="#2f6fde"/><text x="30" y="19" font-size="11" fill="#1f2328" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">present_decision</text><text x="740" y="19" font-size="10" fill="#6b7280" text-anchor="end">waits for your answer</text><text x="20" y="54" font-size="15" fill="#1f2328" font-weight="600">Session store migration</text><text x="20" y="70" font-size="11" fill="#6b7280">1.2M active sessions in Postgres `sessions`. Sessions live 14 days. Logging everyone out is acceptable only outside</text><text x="20" y="86" font-size="11" fill="#6b7280">business hours.</text><rect x="20" y="100" width="3" height="20" rx="1" fill="#2f6fde" stroke="none" stroke-width="1"/><text x="31" y="114" font-size="12" fill="#1f2328" font-weight="600">How do we move sessions to Redis?</text><g opacity="1"><rect x="20" y="134" width="233.3" height="153" rx="6" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="30" y="153" font-size="12" fill="#1f2328" font-weight="600">Big bang</text><circle cx="236.33333333333334" cy="149" r="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="30" y="166" font-size="10.5" fill="#6b7280">Deploy Redis-only and invalidate all</text><text x="30" y="179" font-size="10.5" fill="#6b7280">sessions on a Sunday night.</text><text x="30" y="198" font-size="10.5" fill="#2e9e5b">+ Simplest code</text><text x="30" y="211" font-size="10.5" fill="#2e9e5b">+ Done in one release</text><text x="30" y="224" font-size="10.5" fill="#d14b4b">− Everyone logs in again</text><text x="30" y="237" font-size="10.5" fill="#d14b4b">− No gradual signal</text><text x="30" y="278" font-size="9.5" fill="#6b7280">effort: low  ·  risk: high</text></g><g opacity="1"><rect x="263.3" y="134" width="233.3" height="153" rx="6" fill="#e3edfd" stroke="#2f6fde" stroke-width="2"/><text x="273.3" y="153" font-size="12" fill="#1f2328" font-weight="600">Dual-write, then cut over</text><circle cx="479.66666666666674" cy="149" r="6" fill="#ffffff" stroke="#2f6fde" stroke-width="1.4"/><circle cx="479.66666666666674" cy="149" r="3" fill="#2f6fde"/><text x="273.3" y="166" font-size="9.5" fill="#2f6fde" font-weight="600">★ recommended</text><text x="273.3" y="179" font-size="10.5" fill="#6b7280">Write to both, read from Redis with</text><text x="273.3" y="192" font-size="10.5" fill="#6b7280">Postgres fallback, drop Postgres</text><text x="273.3" y="205" font-size="10.5" fill="#6b7280">after 14 days.</text><text x="273.3" y="224" font-size="10.5" fill="#2e9e5b">+ No forced logout</text><text x="273.3" y="237" font-size="10.5" fill="#2e9e5b">+ Rollback is a flag flip</text><text x="273.3" y="250" font-size="10.5" fill="#d14b4b">− Two code paths for 2 weeks</text><text x="273.3" y="278" font-size="9.5" fill="#6b7280">effort: medium  ·  risk: low</text></g><g opacity="1"><rect x="506.7" y="134" width="233.3" height="153" rx="6" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="516.7" y="153" font-size="12" fill="#1f2328" font-weight="600">Tenant by tenant</text><circle cx="723" cy="149" r="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="516.7" y="166" font-size="10.5" fill="#6b7280">Move tenants in waves behind a</text><text x="516.7" y="179" font-size="10.5" fill="#6b7280">per-tenant flag.</text><text x="516.7" y="198" font-size="10.5" fill="#2e9e5b">+ Smallest blast radius</text><text x="516.7" y="211" font-size="10.5" fill="#d14b4b">− Longest</text><text x="516.7" y="224" font-size="10.5" fill="#d14b4b">− Flag bookkeeping</text><text x="516.7" y="278" font-size="9.5" fill="#6b7280">effort: high  ·  risk: low</text></g><line x1="152" y1="313" x2="152" y2="433" stroke="#c5cad3" stroke-width="1" stroke-dasharray="2 3"/><text x="152" y="446" font-size="9.5" fill="#6b7280" text-anchor="middle">0</text><line x1="227.9" y1="313" x2="227.9" y2="433" stroke="#c5cad3" stroke-width="1" stroke-dasharray="2 3"/><text x="227.9" y="446" font-size="9.5" fill="#6b7280" text-anchor="middle">3</text><line x1="303.8" y1="313" x2="303.8" y2="433" stroke="#c5cad3" stroke-width="1" stroke-dasharray="2 3"/><text x="303.8" y="446" font-size="9.5" fill="#6b7280" text-anchor="middle">6</text><line x1="379.7" y1="313" x2="379.7" y2="433" stroke="#c5cad3" stroke-width="1" stroke-dasharray="2 3"/><text x="379.7" y="446" font-size="9.5" fill="#6b7280" text-anchor="middle">9</text><line x1="455.7" y1="313" x2="455.7" y2="433" stroke="#c5cad3" stroke-width="1" stroke-dasharray="2 3"/><text x="455.7" y="446" font-size="9.5" fill="#6b7280" text-anchor="middle">12</text><line x1="531.6" y1="313" x2="531.6" y2="433" stroke="#c5cad3" stroke-width="1" stroke-dasharray="2 3"/><text x="531.6" y="446" font-size="9.5" fill="#6b7280" text-anchor="middle">15</text><line x1="607.5" y1="313" x2="607.5" y2="433" stroke="#c5cad3" stroke-width="1" stroke-dasharray="2 3"/><text x="607.5" y="446" font-size="9.5" fill="#6b7280" text-anchor="middle">18</text><line x1="683.4" y1="313" x2="683.4" y2="433" stroke="#c5cad3" stroke-width="1" stroke-dasharray="2 3"/><text x="683.4" y="446" font-size="9.5" fill="#6b7280" text-anchor="middle">21</text><text x="20" y="446" font-size="9.5" fill="#6b7280">days</text><g><text x="20" y="342" font-size="11" fill="#1f2328" opacity="1">Big bang</text><g opacity="1"><rect x="152" y="328" width="73.9" height="20" rx="4" fill="#f4f5f7" fill-opacity="1" stroke="#c5cad3" stroke-width="1"/><text x="158" y="342" font-size="10" fill="#1f2328">Build</text></g><g opacity="1"><rect x="227.9" y="328" width="23.3" height="20" rx="4" fill="#f4f5f7" fill-opacity="1" stroke="#c5cad3" stroke-width="1"/><text x="233.9" y="342" font-size="10" fill="#1f2328">C…</text></g></g><g><text x="20" y="382" font-size="11" fill="#2f6fde" font-weight="600" opacity="1">Dual-write</text><g opacity="1"><rect x="152" y="368" width="99.2" height="20" rx="4" fill="#2f6fde" fill-opacity="0.14" stroke="#2f6fde" stroke-width="1.6"/><text x="158" y="382" font-size="10" fill="#1f2328">Build</text></g><g opacity="1"><rect x="253.2" y="368" width="352.3" height="20" rx="4" fill="#2f6fde" fill-opacity="0.14" stroke="#2f6fde" stroke-width="1.6"/><text x="259.2" y="382" font-size="10" fill="#1f2328">Dual-write + fallback read</text></g><g opacity="1"><rect x="607.5" y="368" width="48.6" height="20" rx="4" fill="#2f6fde" fill-opacity="0.14" stroke="#2f6fde" stroke-width="1.6"/><text x="613.5" y="382" font-size="10" fill="#1f2328">Drop PG</text></g></g><g><text x="20" y="422" font-size="11" fill="#1f2328" opacity="1">Tenant by tenant</text><g opacity="1"><rect x="152" y="408" width="149.8" height="20" rx="4" fill="#f4f5f7" fill-opacity="1" stroke="#c5cad3" stroke-width="1"/><text x="158" y="422" font-size="10" fill="#1f2328">Build + flags</text></g><g opacity="1"><rect x="303.8" y="408" width="124.5" height="20" rx="4" fill="#f4f5f7" fill-opacity="1" stroke="#c5cad3" stroke-width="1"/><text x="309.8" y="422" font-size="10" fill="#1f2328">Wave 1</text></g><g opacity="1"><rect x="430.3" y="408" width="124.5" height="20" rx="4" fill="#f4f5f7" fill-opacity="1" stroke="#c5cad3" stroke-width="1"/><text x="436.3" y="422" font-size="10" fill="#1f2328">Wave 2</text></g><g opacity="1"><rect x="556.9" y="408" width="124.5" height="20" rx="4" fill="#f4f5f7" fill-opacity="1" stroke="#c5cad3" stroke-width="1"/><text x="562.9" y="422" font-size="10" fill="#1f2328">Wave 3</text></g><g opacity="1"><rect x="683.4" y="408" width="48.6" height="20" rx="4" fill="#f4f5f7" fill-opacity="1" stroke="#c5cad3" stroke-width="1"/><text x="689.4" y="422" font-size="10" fill="#1f2328">Drop PG</text></g></g><g opacity="1"><polygon points="253.2,331 260.2,338 253.2,345 246.2,338" fill="#d14b4b" stroke="#ffffff"/><text x="253.2" y="324" font-size="9.5" fill="#d14b4b" font-weight="600" text-anchor="middle">no way back</text></g><g opacity="1"><polygon points="607.5,371 614.5,378 607.5,385 600.5,378" fill="#d14b4b" stroke="#ffffff"/><text x="607.5" y="364" font-size="9.5" fill="#d14b4b" font-weight="600" text-anchor="middle">no way back</text></g><g opacity="1"><polygon points="683.4,411 690.4,418 683.4,425 676.4,418" fill="#d14b4b" stroke="#ffffff"/><text x="683.4" y="404" font-size="9.5" fill="#d14b4b" font-weight="600" text-anchor="end">no way back</text></g><line x1="0" y1="471" x2="760" y2="471" stroke="#c5cad3" stroke-width="1"/><rect x="20" y="485" width="342.4" height="30" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="30" y="504" font-size="11" fill="#6b7280">Add a note (optional)</text><rect x="372.4" y="485" width="107.2" height="30" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="426" y="504" font-size="11" fill="#1f2328" text-anchor="middle">None of these</text><rect x="489.6" y="485" width="250.4" height="30" rx="5" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="614.8" y="504" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">Confirm: Dual-write, then cut over</text>
</svg>
