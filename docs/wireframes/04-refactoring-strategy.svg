<path d="M0,8 a8,8 0 0 1 8,-8 h744 a8,8 0 0 1 8,8 v22 h-760 z" fill="#f4f5f7"/><line x1="0" y1="30" x2="760" y2="30" stroke="#c5cad3" stroke-width="1"/><circle cx="20" cy="15" r="4" fill="#2f6fde"/><text x="30" y="19" font-size="11" fill="#1f2328" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">present_decision</text><text x="740" y="19" font-size="10" fill="#6b7280" text-anchor="end">waits for your answer</text><text x="20" y="54" font-size="15" fill="#1f2328" font-weight="600">Breaking up OrderService</text><text x="20" y="70" font-size="11" fill="#6b7280">OrderService.ts is 2,400 lines, imported by 31 files, and owns pricing, stock reservation and invoicing.</text><rect x="20" y="84" width="3" height="20" rx="1" fill="#2f6fde" stroke="none" stroke-width="1"/><text x="31" y="98" font-size="12" fill="#1f2328" font-weight="600">Which refactoring strategy should I follow?</text><g opacity="1"><rect x="20" y="118" width="233.3" height="153" rx="6" fill="#e3edfd" stroke="#2f6fde" stroke-width="2"/><text x="30" y="137" font-size="12" fill="#1f2328" font-weight="600">Extract by domain</text><circle cx="236.33333333333334" cy="133" r="6" fill="#ffffff" stroke="#2f6fde" stroke-width="1.4"/><circle cx="236.33333333333334" cy="133" r="3" fill="#2f6fde"/><text x="30" y="150" font-size="9.5" fill="#2f6fde" font-weight="600">★ recommended</text><text x="30" y="163" font-size="10.5" fill="#6b7280">Pull Pricing, Stock and Invoicing</text><text x="30" y="176" font-size="10.5" fill="#6b7280">into their own modules; OrderService</text><text x="30" y="189" font-size="10.5" fill="#6b7280">becomes an orchestrator.</text><text x="30" y="208" font-size="10.5" fill="#2e9e5b">+ Clear ownership</text><text x="30" y="221" font-size="10.5" fill="#2e9e5b">+ Each step is shippable</text><text x="30" y="234" font-size="10.5" fill="#d14b4b">− 31 import sites to update</text><text x="30" y="262" font-size="9.5" fill="#6b7280">effort: medium  ·  risk: medium</text></g><g opacity="1"><rect x="263.3" y="118" width="233.3" height="153" rx="6" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="273.3" y="137" font-size="12" fill="#1f2328" font-weight="600">Facade first</text><circle cx="479.66666666666674" cy="133" r="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="273.3" y="150" font-size="10.5" fill="#6b7280">Keep the public API, move internals</text><text x="273.3" y="163" font-size="10.5" fill="#6b7280">behind a facade, split later.</text><text x="273.3" y="182" font-size="10.5" fill="#2e9e5b">+ Callers untouched</text><text x="273.3" y="195" font-size="10.5" fill="#d14b4b">− Two layers until phase 2</text><text x="273.3" y="208" font-size="10.5" fill="#d14b4b">− Easy to stop halfway</text><text x="273.3" y="262" font-size="9.5" fill="#6b7280">effort: low  ·  risk: low</text></g><g opacity="1"><rect x="506.7" y="118" width="233.3" height="153" rx="6" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="516.7" y="137" font-size="12" fill="#1f2328" font-weight="600">Rewrite as pipeline</text><circle cx="723" cy="133" r="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="516.7" y="150" font-size="10.5" fill="#6b7280">Replace with an explicit order</text><text x="516.7" y="163" font-size="10.5" fill="#6b7280">pipeline of steps.</text><text x="516.7" y="182" font-size="10.5" fill="#2e9e5b">+ Best final design</text><text x="516.7" y="195" font-size="10.5" fill="#d14b4b">− Big-bang switch</text><text x="516.7" y="208" font-size="10.5" fill="#d14b4b">− Behaviour drift risk</text><text x="516.7" y="262" font-size="9.5" fill="#6b7280">effort: high  ·  risk: high</text></g><g transform="translate(103.8,289) scale(1)"><g opacity="1"><polyline points="103.7,108 151.5,128 220.2,128 288.8,128 313,122.8" fill="none" stroke="#2f6fde" stroke-width="1.6" stroke-linejoin="round"/><polygon points="313,122.8 307.1,121.7 308,126.3" fill="#2f6fde"/></g><g opacity="0.42"><polyline points="130.5,94 151.5,94 172.5,94" 