rcle cx="530.1" cy="66" r="7" fill="#2e9e5b"/><text x="530.1" y="69.5" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">+</text></g><g opacity="1"><rect x="459.7" y="108" width="82.7" height="28" rx="5" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.6"/><rect x="459.7" y="108" width="82.7" height="28" rx="5" fill="#2e9e5b" fill-opacity="0.1" stroke="none" stroke-width="1"/><text x="501.1" y="126" font-size="11" fill="#1f2328" text-anchor="middle">Invoicing</text><circle cx="540.4" cy="110" r="7" fill="#2e9e5b"/><text x="540.4" y="113.5" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">+</text></g><g opacity="0.42"><rect x="309.8" y="42" width="107.9" height="28" rx="5" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.6"/><rect x="309.8" y="42" width="107.9" height="28" rx="5" fill="#2e9e5b" fill-opacity="0.1" stroke="none" stroke-width="1"/><text x="363.8" y="60" font-size="11" fill="#1f2328" text-anchor="middle">OrderPipeline</text><circle cx="415.7" cy="44" r="7" fill="#2e9e5b"/><text x="415.7" y="47.5" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">+</text></g><g opacity="1"><rect x="459.7" y="152" width="82.7" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="501.1" y="170" font-size="11" fill="#1f2328" text-anchor="middle">OrderRepo</text></g></g><line x1="0" y1="497" x2="760" y2="497" stroke="#c5cad3" stroke-width="1"/><rect x="20" y="511" width="395.2" height="30" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="30" y="530" font-size="11" fill="#6b7280">Add a note (optional)</text><rect x="425.2" y="511" width="107.2" height="30" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="478.8" y="530" font-size="11" fill="#1f2328" text-anchor="middle">None of these</text><rect x="542.4" y="511" width="197.6" height="30" rx="5" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="641.2" y="530" font-size="11" fill="#fff" font-weight="600" text-anchor