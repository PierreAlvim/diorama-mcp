<path d="M0,8 a8,8 0 0 1 8,-8 h744 a8,8 0 0 1 8,8 v22 h-760 z" fill="#f4f5f7"/><line x1="0" y1="30" x2="760" y2="30" stroke="#c5cad3" stroke-width="1"/><circle cx="20" cy="15" r="4" fill="#2f6fde"/><text x="30" y="19" font-size="11" fill="#1f2328" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">present_decision</text><text x="740" y="19" font-size="10" fill="#6b7280" text-anchor="end">waits for your answer</text><text x="20" y="54" font-size="15" fill="#1f2328" font-weight="600">Onboarding revamp — what fits in 15 points</text><text x="20" y="70" font-size="11" fill="#6b7280">Seven candidate items add up to 27 points. Ordered by expected effect on activation.</text><rect x="20" y="84" width="3" height="20" rx="1" fill="#2f6fde" stroke="none" stroke-width="1"/><text x="31" y="98" font-size="12" fill="#1f2328" font-weight="600">Which items make the cut?</text><g opacity="1"><rect x="20" y="118" width="720" height="36" rx="4" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><rect x="29" y="130" width="12" height="12" rx="2" fill="#2f6fde" stroke="#2f6fde" stroke-width="1.4"/><text x="35" y="140" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">✓</text><text x="48" y="133" font-size="11" fill="#6b7280">1.</text><text x="68" y="133" font-size="11" fill="#1f2328" font-weight="600">Skip email verification until first save</text><text x="68" y="147" font-size="10" fill="#6b7280">largest drop-off in the funnel (38%)</text><text x="732" y="133" font-size="10" fill="#6b7280" text-anchor="end">3 pts</text></g><g opacity="1"><rect x="20" y="158" width="720" height="36" rx="4" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><rect x="29" y="170" width="12" height="12" rx="2" fill="#2f6fde" stroke="#2f6fde" stroke-width="1.4"/><text x="35" y="180" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">✓</text><text x="48" y="173" font-size="11" fill="#6b7280">2.</text><text x="68" y="173" font-size="11" fill="#1f2328" font-weight="600">Sample project on first login</text><text x="68" y="187" font-size="10" fill="#6b7280">users with a project in session 1 retain 2× better</text><text x="732" y="173" font-size="10" fill="#6b7280" text-anchor="end">5 pts</text></g><g opacity="1"><rect x="20" y="198" width="720" height="22" rx="4" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><rect x="29" y="203" width="12" height="12" rx="2" fill="#2f6fde" stroke="#2f6fde" stroke-width="1.4"/><text x="35" y="213" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">✓</text><text x="48" y="213" font-size="11" fill="#6b7280">3.</text><text x="68" y="213" font-size="11" fill="#1f2328" font-weight="600">Inline hints on the editor toolbar</text><text x="732" y="213" font-size="10" fill="#6b7280" text-anchor="end">2 pts</text></g><g opacity="1"><rect x="20" y="224" width="720" height="36" rx="4" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><rect x="29" y="236" width="12" height="12" rx="2" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="48" y="239" font-size="11" fill="#6b7280">4.</text><text x="68" y="239" font-size="11" fill="#1f2328" font-weight="600">Interactive product tour</text><text x="68" y="253" font-size="10" fill="#6b7280">needs a tour library and copy for 9 steps</text><text x="732" y="239" font-size="10" fill="#6b7280" text-anchor="end">8 pts</text></g><g opacity="1"><rect x="20" y="264" width="720" height="22" rx="4" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><rect x="29" y="269" width="12" height="12" rx="2" fill="#2f6fde" stroke="#2f6fde" stroke-width="1.4"/><text x="35" y="279" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">✓</text><text x="48" y="279" font-size="11" fill="#6b7280">5.</text><text x="68" y="279" font-size="11" fill="#1f2328" font-weight="600">Invite teammates step</text><text x="732" y="279" font-size="10" fill="#6b7280" text-anchor="end">3 pts</text></g><g opacity="1"><rect x="20" y="290" width="720" height="22" rx="4" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><rect x="29" y="295" width="12" height="12" rx="2" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="48" y="305" font-size="11" fill="#6b7280">6.</text><text x="68" y="305" font-size="11" fill="#1f2328" font-weight="600">Progress checklist widget</text><text x="732" y="305" font-size="10" fill="#6b7280" text-anchor="end">4 pts</text></g><g opacity="1"><rect x="20" y="316" width="720" height="22" rx="4" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><rect x="29" y="321" width="12" height="12" rx="2" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="48" y="331" font-size="11" fill="#6b7280">7.</text><text x="68" y="331" font-size="11" fill="#1f2328" font-weight="600">Welcome email sequence</text><text x="732" y="331" font-size="10" fill="#6b7280" text-anchor="end">2 pts</text></g><line x1="0" y1="360" x2="760" y2="360" stroke="#c5cad3" stroke-width="1"/><rect x="20" y="374" width="545.4" height="30" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="30" y="393" font-size="11" fill="#6b7280">Add a note (optional)</text><rect x="575.4" y="374" width="164.6" height="30" rx="5" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="657.7" y="393" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">Confirm selection (4)</text><text x="20" y="420" font-size="10.5" fill="#6b7280">Selected 13 of 15 points</text>
