<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 668" width="760" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="759" height="667" rx="8" fill="#ffffff" stroke="#c5cad3"/>
<path d="M0,8 a8,8 0 0 1 8,-8 h744 a8,8 0 0 1 8,8 v22 h-760 z" fill="#f4f5f7"/><line x1="0" y1="30" x2="760" y2="30" stroke="#c5cad3" stroke-width="1"/><circle cx="20" cy="15" r="4" fill="#2e9e5b"/><text x="30" y="19" font-size="11" fill="#1f2328" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">present_view</text><text x="740" y="19" font-size="10" fill="#6b7280" text-anchor="end">does not block the agent</text><text x="20" y="54" font-size="15" fill="#1f2328" font-weight="600">How this repository is organised</text><text x="20" y="70" font-size="11" fill="#6b7280">Following one request — "create an order" — from the browser to the database and the background worker.</text><g transform="translate(268.4,86) scale(1)"><g opacity="0.42"><polyline points="140.6,38 140.6,58 140.6,78" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="140.6,78 142.9,72.5 138.3,72.5" fill="#6b7280"/><rect x="127.4" y="50" width="26.4" height="15" rx="2" fill="#ffffff" stroke="none" stroke-width="1"/><text x="140.6" y="61.5" font-size="9.5" fill="#6b7280" text-anchor="middle">HTTP</text></g><g opacity="0.42"><polyline points="140.6,106 140.6,119 140.6,132" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="140.6,132 142.9,126.5 138.3,126.5" fill="#6b7280"/></g><g opacity="0.42"><polyline points="140.6,160 140.6,173 140.6,186" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="140.6,186 142.9,180.5 138.3,180.5" fill="#6b7280"/></g><g opacity="1"><polyline points="166.3,214 203.1,234 203.1,268 203.1,295 203.1,322 203.1,349 188.1,362" fill="none" stroke="#2f6fde" stroke-width="1.6" stroke-linejoin="round"/><polygon points="188.1,362 193.8,360.2 190.7,356.6" fill="#2f6fde"/></g><g opacity="1"><polyline points="171.9,390 171.9,403 171.9,416" fill="none" stroke="#2f6fde" stroke-width="1.6" stroke-linejoin="round"/><polygon points="171.9,416 174.2,410.5 169.5,410.5" fill="#2f6fde"/></g><g opacity="0.42"><polyline points="140.6,214 140.6,234 140.6,254" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="140.6,254 142.9,248.5 138.3,248.5" fill="#6b7280"/><rect x="119" y="226" width="43.2" height="15" rx="2" fill="#ffffff" stroke="none" stroke-width="1"/><text x="140.6" y="237.5" font-size="9.5" fill="#6b7280" text-anchor="middle">publish</text></g><g opacity="0.42"><polyline points="140.6,282 140.6,295 140.6,308" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="140.6,308 142.9,302.5 138.3,302.5" fill="#6b7280"/></g><g opacity="0.42"><polyline points="140.6,336 140.6,349 155.6,362" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="155.6,362 153,356.6 149.9,360.2" fill="#6b7280"/></g><g opacity="0.42"><polyline points="101.3,214 45.1,234 45.1,254" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="45.1,254 47.4,248.5 42.7,248.5" fill="#6b7280"/></g><g opacity="0.42"><rect x="83.5" y="10" width="114.2" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="140.6" y="28" font-size="11" fill="#1f2328" text-anchor="middle">web/ (Next.js)</text></g><g opacity="0.42"><rect x="96.1" y="132" width="89" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="140.6" y="150" font-size="11" fill="#1f2328" text-anchor="middle">src/routes</text></g><g opacity="0.42"><rect x="83.5" y="78" width="114.2" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="140.6" y="96" font-size="11" fill="#1f2328" text-anchor="middle">src/middleware</text></g><g opacity="1"><rect x="89.8" y="186" width="101.6" height="28" rx="5" fill="#e3edfd" stroke="#2f6fde" stroke-width="1.6"/><text x="140.6" y="204" font-size="11" fill="#1f2328" text-anchor="middle">src/services</text></g><g opacity="1"><rect x="130.5" y="362" width="82.7" height="28" rx="5" fill="#e3edfd" stroke="#2f6fde" stroke-width="1.6"/><text x="171.9" y="380" font-size="11" fill="#1f2328" text-anchor="middle">src/repos</text></g><g opacity="1"><rect x="133.6" y="416" width="76.4" height="28" rx="5" fill="#e3edfd" stroke="#2f6fde" stroke-width="1.6"/><text x="171.9" y="434" font-size="11" fill="#1f2328" text-anchor="middle">Postgres</text></g><g opacity="0.42"><rect x="96.1" y="254" width="89" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="140.6" y="272" font-size="11" fill="#1f2328" text-anchor="middle">src/events</text></g><g opacity="0.42"><rect x="102.4" y="308" width="76.4" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="140.6" y="326" font-size="11" fill="#1f2328" text-anchor="middle">src/jobs</text></g><g opacity="0.42"><rect x="10" y="254" width="70.1" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="45.1" y="272" font-size="11" fill="#1f2328" text-anchor="middle">src/lib</text></g></g><rect x="20" y="558" width="720" height="52" rx="6" fill="#e3edfd" stroke="#2f6fde" stroke-width="1"/><text x="32" y="578" font-size="10.5" fill="#2f6fde" font-weight="600">Step 3 of 4</text><text x="116" y="578" font-size="11" fill="#1f2328">src/services holds the business rules. Services never run SQL; they go through src/repos,</text><text x="116" y="593" font-size="11" fill="#1f2328">the only code that talks to Postgres.</text><rect x="682" y="573" width="22" height="22" rx="11" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="693" y="588" font-size="13" fill="#1f2328" text-anchor="middle">‹</text><rect x="710" y="573" width="22" height="22" rx="11" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="721" y="588" font-size="13" fill="#fff" text-anchor="middle">›</text><line x1="0" y1="626" x2="760" y2="626" stroke="#c5cad3" stroke-width="1"/><text x="20" y="650" font-size="10.5" fill="#6b7280">Click any element to ask the agent about it.</text>
</svg>
