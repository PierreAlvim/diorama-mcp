<path d="M0,8 a8,8 0 0 1 8,-8 h744 a8,8 0 0 1 8,8 v22 h-760 z" fill="#f4f5f7"/><line x1="0" y1="30" x2="760" y2="30" stroke="#c5cad3" stroke-width="1"/><circle cx="20" cy="15" r="4" fill="#2f6fde"/><text x="30" y="19" font-size="11" fill="#1f2328" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">present_decision</text><text x="740" y="19" font-size="10" fill="#6b7280" text-anchor="end">waits for your answer</text><text x="20" y="54" font-size="15" fill="#1f2328" font-weight="600">Epic: Organisations</text><text x="20" y="70" font-size="11" fill="#6b7280">Proposed breakdown. Nothing is created in Jira until you submit.</text><rect x="20" y="84" width="3" height="20" rx="1" fill="#2f6fde" stroke="none" stroke-width="1"/><text x="31" y="98" font-size="12" fill="#1f2328" font-weight="600">Which stories should I create?</text><g opacity="1"><text x="22" y="134" font-size="11" fill="#1f2328" font-weight="600">Organisations</text><text x="740" y="134" font-size="10" fill="#6b7280" text-anchor="end">31 pts</text></g><line x1="26" y1="135.5" x2="26" y2="153" stroke="#c5cad3" stroke-width="1"/><line x1="26" y1="153" x2="37" y2="153" stroke="#c5cad3" stroke-width="1"/><g opacity="1"><rect x="42" y="146" width="15" height="14" rx="3" fill="#2e9e5b" stroke="#2e9e5b" stroke-width="1"/><text x="49.5" y="157" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">✓</text><rect x="60" y="146" width="15" height="14" rx="3" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="67.5" y="157" font-size="10" fill="#6b7280" font-weight="600" text-anchor="middle">✗</text><text x="82" y="157" font-size="11" fill="#1f2328" font-weight="600">As an owner I can create an organisation</text><text x="740" y="157" font-size="10" fill="#6b7280" text-anchor="end">5 pts</text></g><line x1="46" y1="158.5" x2="46" y2="176" stroke="#c5cad3" stroke-width="1"/><line x1="46" y1="176" x2="57" y2="176" stroke="#c5cad3" stroke-width="1"/><g opacity="1"><text x="62" y="1