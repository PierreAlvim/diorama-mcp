ity="1"><rect x="42" y="307" width="15" height="14" rx="3" fill="#2e9e5b" stroke="#2e9e5b" stroke-width="1"/><text x="49.5" y="318" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">✓</text><rect x="60" y="307" width="15" height="14" rx="3" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="67.5" y="318" font-size="10" fill="#6b7280" font-weight="600" text-anchor="middle">✗</text><text x="82" y="318" font-size="11" fill="#1f2328" font-weight="600">As a member I see only my organisation's projects</text><text x="740" y="318" font-size="10" fill="#6b7280" text-anchor="end">5 pts</text></g><line x1="46" y1="319.5" x2="46" y2="337" stroke="#c5cad3" stroke-width="1"/><line x1="46" y1="337" x2="57" y2="337" stroke="#c5cad3" stroke-width="1"/><g opacity="1"><text x="62" y="341" font-size="11" fill="#1f2328">Scope queries by org_id</text></g><line x1="46" y1="342.5" x2="46" y2="360" stroke="#c5cad3" stroke-width="1"/><line x1="46" y1="360" x2="57" y2="360" stroke="#c5cad3" stroke-width="1"/><g opacity="1"><text x="62" y="364" font-size="11" fill="#1f2328">Organisation switcher</text></g><line x1="26" y1="365.5" x2="26" y2="383" stroke="#c5cad3" stroke-width="1"/><line x1="26" y1="383" x2="37" y2="383" stroke="#c5cad3" stroke-width="1"/><g opacity="1"><rect x="42" y="376" width="15" height="14" rx="3" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="49.5" y="387" font-size="10" fill="#6b7280" font-weight="600" text-anchor="middle">✓</text><rect x="60" y="376" width="15" height="14" rx="3" fill="#d14b4b" stroke="#d14b4b" stroke-width="1"/><text x="67.5" y="387" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">✗</text><text x="82" y="387" font-size="11" fill="#1f2328" font-weight="600">As an admin I can enforce SSO for my organisation</text><text x="740" y="387" font-size="10" fill="#6b7280" text-anchor="end">13 pts</text></g><line x1="46" y1="388.5" x2="46" y2="406" stroke="#c5cad3" stroke-width="1"/><line x1="46" y1="406" x2="57" y2="406" stroke="#c5cad3" stroke-width="1"/><g opacity="1"><text x="62" y="410" font-size="11" fill="#1f2328">SAML configuration page</text></g><line x1="46" y1="411.5" x2="46" y2="429" stroke="#c5cad3" stroke-width="1"/><line x1="46" y1="429" x2="57" y2="429" stroke="#c5cad3" stroke-width="1"/><g opacity="1"><text x="62" y="433" font-size="11" fill="#1f2328">Login redirect by email domain</text></g><line x1="0" y1="460" x2="760" y2="460" stroke="#c5cad3" stroke-width="1"/><rect x="20" y="474" width="493.8" height="30" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="30" y="493" font-size="11" fill="#1f2328">SSO goes to a separate epic</text><rect x="523.8" y="474" width="94.4" height="30" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="571" y="493" font-size="11" fill="#1f2328" text-anchor="middle">Approve all</text><rect x="628.2" y="474" width="111.8" height="30" rx="5" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="684.1" y="493" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">Submit review</text><text x="20" y="520" font-size="10.5" fill="#6b7280">3 approved · 1 rejected</text>
