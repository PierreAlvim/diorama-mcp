<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 688" width="760" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="759" height="687" rx="8" fill="#ffffff" stroke="#c5cad3"/>
<path d="M0,8 a8,8 0 0 1 8,-8 h744 a8,8 0 0 1 8,8 v22 h-760 z" fill="#f4f5f7"/><line x1="0" y1="30" x2="760" y2="30" stroke="#c5cad3" stroke-width="1"/><circle cx="20" cy="15" r="4" fill="#2f6fde"/><text x="30" y="19" font-size="11" fill="#1f2328" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">present_decision</text><text x="740" y="19" font-size="10" fill="#6b7280" text-anchor="end">waits for your answer</text><text x="20" y="54" font-size="15" fill="#1f2328" font-weight="600">Real-time notifications</text><text x="20" y="70" font-size="11" fill="#6b7280">The web app polls /notifications every 30s. Product wants updates within 2s. We run 4 stateless API pods behind an</text><text x="20" y="86" font-size="11" fill="#6b7280">ALB.</text><rect x="20" y="100" width="3" height="20" rx="1" fill="#2f6fde" stroke="none" stroke-width="1"/><text x="31" y="114" font-size="12" fill="#1f2328" font-weight="600">How should we deliver notifications to the browser?</text><g opacity="1"><rect x="20" y="134" width="233.3" height="153" rx="6" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="30" y="153" font-size="12" fill="#1f2328" font-weight="600">WebSocket gateway</text><circle cx="236.33333333333334" cy="149" r="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="30" y="166" font-size="10.5" fill="#6b7280">Dedicated gateway service holding</text><text x="30" y="179" font-size="10.5" fill="#6b7280">bidirectional connections.</text><text x="30" y="198" font-size="10.5" fill="#2e9e5b">+ Bidirectional, lowest latency</text><text x="30" y="211" font-size="10.5" fill="#2e9e5b">+ Reusable for chat later</text><text x="30" y="224" font-size="10.5" fill="#d14b4b">− New service to run</text><text x="30" y="237" font-size="10.5" fill="#d14b4b">− Sticky sessions on the ALB</text><text x="30" y="278" font-size="9.5" fill="#6b7280">effort: high  ·  risk: medium</text></g><g opacity="1"><rect x="263.3" y="134" width="233.3" height="153" rx="6" fill="#e3edfd" stroke="#2f6fde" stroke-width="2"/><text x="273.3" y="153" font-size="12" fill="#1f2328" font-weight="600">Server-Sent Events</text><circle cx="479.66666666666674" cy="149" r="6" fill="#ffffff" stroke="#2f6fde" stroke-width="1.4"/><circle cx="479.66666666666674" cy="149" r="3" fill="#2f6fde"/><text x="273.3" y="166" font-size="9.5" fill="#2f6fde" font-weight="600">★ recommended</text><text x="273.3" y="179" font-size="10.5" fill="#6b7280">One-way stream from the existing API</text><text x="273.3" y="192" font-size="10.5" fill="#6b7280">pods, fan-out through Redis pub/sub.</text><text x="273.3" y="211" font-size="10.5" fill="#2e9e5b">+ Plain HTTP, no new service</text><text x="273.3" y="224" font-size="10.5" fill="#2e9e5b">+ Auto-reconnect built in</text><text x="273.3" y="237" font-size="10.5" fill="#d14b4b">− One-way only</text><text x="273.3" y="250" font-size="10.5" fill="#d14b4b">− One connection per tab</text><text x="273.3" y="278" font-size="9.5" fill="#6b7280">effort: medium  ·  risk: low</text></g><g opacity="1"><rect x="506.7" y="134" width="233.3" height="153" rx="6" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="516.7" y="153" font-size="12" fill="#1f2328" font-weight="600">Faster polling</text><circle cx="723" cy="149" r="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="516.7" y="166" font-size="10.5" fill="#6b7280">Keep polling, drop the interval to</text><text x="516.7" y="179" font-size="10.5" fill="#6b7280">3s and add ETag caching.</text><text x="516.7" y="198" font-size="10.5" fill="#2e9e5b">+ No infra change</text><text x="516.7" y="211" font-size="10.5" fill="#d14b4b">− 10× request volume</text><text x="516.7" y="224" font-size="10.5" fill="#d14b4b">− Never truly real-time</text><text x="516.7" y="278" font-size="9.5" fill="#6b7280">effort: low  ·  risk: low</text></g><text x="209" y="319" font-size="10.5" fill="#1f2328" text-anchor="middle">WebSocket</text><text x="287" y="319" font-size="10.5" fill="#2f6fde" font-weight="600" text-anchor="middle">SSE</text><text x="365" y="319" font-size="10.5" fill="#1f2328" text-anchor="middle">Polling</text><text x="418" y="319" font-size="10" fill="#6b7280">why (SSE)</text><line x1="20" y1="329" x2="740" y2="329" stroke="#c5cad3" stroke-width="1"/><text x="20" y="345" font-size="11" fill="#1f2328">Low latency</text><circle cx="185" cy="341" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="197" cy="341" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="209" cy="341" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="221" cy="341" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="233" cy="341" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="263" cy="341" r="4" fill="#2f6fde" stroke="#2f6fde"/><circle cx="275" cy="341" r="4" fill="#2f6fde" stroke="#2f6fde"/><circle cx="287" cy="341" r="4" fill="#2f6fde" stroke="#2f6fde"/><circle cx="299" cy="341" r="4" fill="#2f6fde" stroke="#2f6fde"/><circle cx="311" cy="341" r="4" fill="#ffffff" stroke="#2f6fde"/><text x="418" y="345" font-size="10" fill="#6b7280">Push; ~100 ms through Redis pub/sub</text><circle cx="341" cy="341" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="353" cy="341" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="365" cy="341" r="4" fill="#ffffff" stroke="#c5cad3"/><circle cx="377" cy="341" r="4" fill="#ffffff" stroke="#c5cad3"/><circle cx="389" cy="341" r="4" fill="#ffffff" stroke="#c5cad3"/><line x1="20" y1="353" x2="740" y2="353" stroke="#c5cad3" stroke-width="1"/><text x="20" y="369" font-size="11" fill="#1f2328">Operational simplicity</text><circle cx="185" cy="365" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="197" cy="365" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="209" cy="365" r="4" fill="#ffffff" stroke="#c5cad3"/><circle cx="221" cy="365" r="4" fill="#ffffff" stroke="#c5cad3"/><circle cx="233" cy="365" r="4" fill="#ffffff" stroke="#c5cad3"/><circle cx="263" cy="365" r="4" fill="#2f6fde" stroke="#2f6fde"/><circle cx="275" cy="365" r="4" fill="#2f6fde" stroke="#2f6fde"/><circle cx="287" cy="365" r="4" fill="#2f6fde" stroke="#2f6fde"/><circle cx="299" cy="365" r="4" fill="#2f6fde" stroke="#2f6fde"/><circle cx="311" cy="365" r="4" fill="#ffffff" stroke="#2f6fde"/><text x="418" y="369" font-size="10" fill="#6b7280">Runs in the existing API pods</text><circle cx="341" cy="365" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="353" cy="365" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="365" cy="365" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="377" cy="365" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="389" cy="365" r="4" fill="#6b7280" stroke="#c5cad3"/><line x1="20" y1="377" x2="740" y2="377" stroke="#c5cad3" stroke-width="1"/><text x="20" y="393" font-size="11" fill="#1f2328">Low infra cost</text><circle cx="185" cy="389" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="197" cy="389" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="209" cy="389" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="221" cy="389" r="4" fill="#ffffff" stroke="#c5cad3"/><circle cx="233" cy="389" r="4" fill="#ffffff" stroke="#c5cad3"/><circle cx="263" cy="389" r="4" fill="#2f6fde" stroke="#2f6fde"/><circle cx="275" cy="389" r="4" fill="#2f6fde" stroke="#2f6fde"/><circle cx="287" cy="389" r="4" fill="#2f6fde" stroke="#2f6fde"/><circle cx="299" cy="389" r="4" fill="#2f6fde" stroke="#2f6fde"/><circle cx="311" cy="389" r="4" fill="#ffffff" stroke="#2f6fde"/><text x="418" y="393" font-size="10" fill="#6b7280">Only Redis pub/sub added</text><circle cx="341" cy="389" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="353" cy="389" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="365" cy="389" r="4" fill="#ffffff" stroke="#c5cad3"/><circle cx="377" cy="389" r="4" fill="#ffffff" stroke="#c5cad3"/><circle cx="389" cy="389" r="4" fill="#ffffff" stroke="#c5cad3"/><line x1="20" y1="401" x2="740" y2="401" stroke="#c5cad3" stroke-width="1"/><text x="20" y="417" font-size="11" fill="#1f2328">Future reuse</text><circle cx="185" cy="413" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="197" cy="413" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="209" cy="413" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="221" cy="413" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="233" cy="413" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="263" cy="413" r="4" fill="#2f6fde" stroke="#2f6fde"/><circle cx="275" cy="413" r="4" fill="#2f6fde" stroke="#2f6fde"/><circle cx="287" cy="413" r="4" fill="#2f6fde" stroke="#2f6fde"/><circle cx="299" cy="413" r="4" fill="#ffffff" stroke="#2f6fde"/><circle cx="311" cy="413" r="4" fill="#ffffff" stroke="#2f6fde"/><text x="418" y="417" font-size="10" fill="#6b7280">Server-to-client only</text><circle cx="341" cy="413" r="4" fill="#6b7280" stroke="#c5cad3"/><circle cx="353" cy="413" r="4" fill="#ffffff" stroke="#c5cad3"/><circle cx="365" cy="413" r="4" fill="#ffffff" stroke="#c5cad3"/><circle cx="377" cy="413" r="4" fill="#ffffff" stroke="#c5cad3"/><circle cx="389" cy="413" r="4" fill="#ffffff" stroke="#c5cad3"/><g transform="translate(36.9,443) scale(1)"><g opacity="1"><polyline points="105.3,127 173.1,127 238.7,127" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="238.7,127 233.1,124.7 233.1,129.3" fill="#6b7280"/></g><g opacity="1"><polyline points="300.7,133.4 380.2,150 443.1,128.8" fill="none" stroke="#2f6fde" stroke-width="1.6" stroke-linejoin="round"/><polygon points="443.1,128.8 437.1,128.4 438.6,132.8" fill="#2f6fde"/><rect x="350.2" y="142" width="60" height="15" rx="2" fill="#ffffff" stroke="none" stroke-width="1"/><text x="380.2" y="153.5" font-size="9.5" fill="#6b7280" text-anchor="middle">SSE stream</text></g><g opacity="0.42"><polyline points="300.7,123.9 380.2,116 443.1,116" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="443.1,116 437.6,113.7 437.6,118.3" fill="#6b7280"/><rect x="344.6" y="108" width="71.2" height="15" rx="2" fill="#ffffff" stroke="none" stroke-width="1"/><text x="380.2" y="119.5" font-size="9.5" fill="#6b7280" text-anchor="middle">GET every 3s</text></g><g opacity="0.42"><polyline points="300.7,114.4 380.2,82 436.8,66" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="436.8,66 430.8,65.3 432.1,69.8" fill="#6b7280"/><rect x="364.2" y="74" width="32" height="15" rx="2" fill="#ffffff" stroke="none" stroke-width="1"/><text x="380.2" y="85.5" font-size="9.5" fill="#6b7280" text-anchor="middle">ws://</text></g><g opacity="1"><polyline points="130.5,34 173.1,41 215.7,41" fill="none" stroke="#2f6fde" stroke-width="1.6" stroke-linejoin="round"/><polygon points="215.7,41 210.2,38.7 210.2,43.3" fill="#2f6fde"/><rect x="151.5" y="33" width="43.2" height="15" rx="2" fill="#ffffff" stroke="none" stroke-width="1"/><text x="173.1" y="44.5" font-size="9.5" fill="#6b7280" text-anchor="middle">publish</text></g><g opacity="1"><polyline points="323.6,47.8 380.2,55 458.1,102" fill="none" stroke="#2f6fde" stroke-width="1.6" stroke-linejoin="round"/><polygon points="458.1,102 454.6,97.1 452.2,101.1" fill="#2f6fde"/></g><g opacity="0.42"><polyline points="323.6,38.1 380.2,35 436.8,45.4" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="436.8,45.4 431.8,42.1 430.9,46.7" fill="#6b7280"/></g><g opacity="1"><polyline points="130.5,15.2 173.1,9 269.7,9 380.2,9 481.3,9 562.8,9 617.2,45.5" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="617.2,45.5 613.9,40.5 611.3,44.4" fill="#6b7280"/></g><g opacity="0.42"><polyline points="519.5,116 562.8,116 619.4,73.5" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round"/><polygon points="619.4,73.5 613.5,75 616.4,78.7" fill="#6b7280"/><rect x="546.8" y="108" width="32" height="15" rx="2" fill="#ffffff" stroke="none" stroke-width="1"/><text x="562.8" y="119.5" font-size="9.5" fill="#6b7280" text-anchor="middle">query</text></g><g opacity="1"><rect x="35.2" y="113" width="70.1" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="70.3" y="131" font-size="11" fill="#1f2328" text-anchor="middle">Browser</text></g><g opacity="1"><rect x="238.7" y="113" width="62" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="269.7" y="131" font-size="11" fill="#1f2328" text-anchor="middle">ALB</text></g><g opacity="1"><rect x="443.1" y="102" width="76.4" height="28" rx="5" fill="#ffffff" stroke="#c98a1b" stroke-width="1.6"/><rect x="443.1" y="102" width="76.4" height="28" rx="5" fill="#c98a1b" fill-opacity="0.1" stroke="none" stroke-width="1"/><text x="487.3" y="120" font-size="11" fill="#1f2328" text-anchor="middle">API pods</text><circle cx="454.1" cy="116" r="5" fill="#c98a1b"/></g><g opacity="0.42"><rect x="436.8" y="39.5" width="89" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="481.3" y="57.5" font-size="11" fill="#1f2328" text-anchor="middle">WS gateway</text></g><g opacity="1"><rect x="215.7" y="27" width="107.9" height="28" rx="5" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.6"/><rect x="215.7" y="27" width="107.9" height="28" rx="5" fill="#2e9e5b" fill-opacity="0.1" stroke="none" stroke-width="1"/><text x="269.7" y="45" font-size="11" fill="#1f2328" text-anchor="middle">Redis pub/sub</text><circle cx="321.6" cy="29" r="7" fill="#2e9e5b"/><text x="321.6" y="32.5" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">+</text></g><g opacity="1"><rect x="10" y="10" width="120.5" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="70.3" y="28" font-size="11" fill="#1f2328" text-anchor="middle">Notifier worker</text></g><g opacity="1"><rect x="599.8" y="45.5" width="76.4" height="28" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="638" y="63.5" font-size="11" fill="#1f2328" text-anchor="middle">Postgres</text></g></g><line x1="0" y1="628" x2="760" y2="628" stroke="#c5cad3" stroke-width="1"/><rect x="20" y="642" width="388.6" height="30" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="30" y="661" font-size="11" fill="#1f2328">keep polling as fallback for the legacy mobile app</text><rect x="418.6" y="642" width="107.2" height="30" rx="5" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="472.2" y="661" font-size="11" fill="#1f2328" text-anchor="middle">None of these</text><rect x="535.8" y="642" width="204.2" height="30" rx="5" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="637.9" y="661" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">Confirm: Server-Sent Events</text>
