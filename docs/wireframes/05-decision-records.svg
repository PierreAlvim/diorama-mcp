<path d="M0,8 a8,8 0 0 1 8,-8 h744 a8,8 0 0 1 8,8 v22 h-760 z" fill="#f4f5f7"/><line x1="0" y1="30" x2="760" y2="30" stroke="#c5cad3" stroke-width="1"/><circle cx="20" cy="15" r="4" fill="#2e9e5b"/><text x="30" y="19" font-size="11" fill="#1f2328" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">present_view</text><text x="740" y="19" font-size="10" fill="#6b7280" text-anchor="end">does not block the agent</text><text x="20" y="54" font-size="15" fill="#1f2328" font-weight="600">Decisions recorded in this project</text><text x="20" y="70" font-size="11" fill="#6b7280">From .diorama/decisions.jsonl — 5 decisions since 2026-10-28.</text><rect x="20" y="86" width="720" height="26" rx="4" fill="#f4f5f7" stroke="none" stroke-width="1"/><text x="292.3" y="103" font-size="10.5" fill="#1f2328" font-weight="600" text-anchor="middle">Date</text><text x="471.4" y="103" font-size="10.5" fill="#1f2328" font-weight="600" text-anchor="middle">Chosen</text><text x="650.5" y="103" font-size="10.5" fill="#1f2328" font-weight="600" text-anchor="middle">Also considered</text><line x1="20" y1="112" x2="740" y2="112" stroke="#c5cad3" stroke-width="1"/><g opacity="1"><rect x="20" y="113" width="720" height="24" rx="4" fill="#e3edfd" stroke="none" stroke-width="1"/><text x="24" y="128.5" font-size="11" fill="#1f2328">Real-time notifications</text><text x="292.3" y="128.5" font-size="10.5" fill="#1f2328" text-anchor="middle">2026-10-28</text><text x="471.4" y="128.5" font-size="10.5" fill="#1f2328" text-anchor="middle">Server-Sent Events</text><text x="650.5" y="128.5" font-size="10.5" fill="#1f2328" text-anchor="middle">WebSocket, polling</text></g><line x1="20" y1="137" x2="740" y2="137" stroke="#c5cad3" stroke-width="1"/><g opacity="0.42"><text x="24" y="153.5" font-size="11" fill="#1f2328">Report export scope</text><text x="292.3" y="153.5" font-size="10.5" fill="#1f2328" text-anchor="middle">2026-10-30</text><text x="471.4" y="153.5" font-size="10.5" fill="#1f2328" text-anchor="middle">Standard</text><text x="650.5" y="153.5" font-size="10.5" fill="#1f2328" text-anchor="middle">Minimal, Full</text></g><line x1="20" y1="162" x2="740" y2="162" stroke="#c5cad3" stroke-width="1"/><g opacity="0.42"><text x="24" y="178.5" font-size="11" fill="#1f2328">Session store migration</text><text x="292.3" y="178.5" font-size="10.5" fill="#1f2328" text-anchor="middle">2026-11-03</text><text x="471.4" y="178.5" font-size="10.5" fill="#1f2328" text-anchor="middle">Dual-write</text><text x="650.5" y="178.5" font-size="10.5" fill="#1f2328" text-anchor="middle">Big bang, per tenant</text></g><line x1="20" y1="187" x2="740" y2="187" stroke="#c5cad3" stroke-width="1"/><g opacity="0.42"><text x="24" y="203.5" font-size="11" fill="#1f2328">Breaking up OrderService</text><text x="292.3" y="203.5" font-size="10.5" fill="#1f2328" text-anchor="middle">2026-11-06</text><text x="471.4" y="203.5" font-size="10.5" fill="#1f2328" text-anchor="middle">Extract by domain</text><text x="650.5" y="203.5" font-size="10.5" fill="#1f2328" text-anchor="middle">Facade, rewrite</text></g><line x1="20" y1="212" x2="740" y2="212" stroke="#c5cad3" stroke-width="1"/><g opacity="0.42"><text x="24" y="228.5" font-size="11" fill="#1f2328">Rate limiter storage</text><text x="292.3" y="228.5" font-size="10.5" fill="#1f2328" text-anchor="middle">2026-11-12</text><text x="471.4" y="228.5" font-size="10.5" fill="#1f2328" text-anchor="middle">None of these</text><text x="650.5" y="228.5" font-size="10.5" fill="#1f2328" text-anchor="middle">Redis, in-memory</text></g><rect x="20" y="86" width="720" height="151" rx="4" fill="none" stroke="#c5cad3" stroke-width="1"/><rect x="20" y="255" width="720" height="52" rx="6" fill="#e3edfd" stroke="#2f6fde" stroke-width="1"/><text x="32" y="275" font-size="10.5" fill="#2f6fde" font-weight="600">Step 1 of 1</text><text x="116" y="275" font-size="11" fill="#1f2328">SSE was chosen on Oct 28 over WebSocket because it runs in the existing API pods; the note</text><text x="116" y="290" font-size="11" fill="#1f2328">asked to keep polling as a fallback for the legacy mobile app.</text><rect x="682" y="270" width="22" height="22" rx="11" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="693" y="285" font-size="13" fill="#1f2328" text-anchor="middle">‹</text><rect x="710" y="270" width="22" height="22" rx="11" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="721" y="285" font-size="13" fill="#fff" text-anchor="middle">›</text><line x1="0" y1="323" x2="760" y2="323" stroke="#c5cad3" stroke-width="1"/><text x="20" y="347" font-size="10.5" fill="#6b7280">Click any element to ask the agent about it.</text>
